name: Release from CHANGELOG.md

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and changelog from CHANGELOG.md
        id: changelog
        run: |
          version=$(grep -m1 -oP '^# WDB \K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          if [ -z "$version" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted version: $version"

          changelog=$(awk '
            BEGIN { print_mode=0; found_first=0 }
            /^# WDB / {
              if (found_first == 1) exit
              if (found_first == 0) { found_first=1; print_mode=1; next }
            }
            print_mode == 1 { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d')

          echo "tag_name=v$version" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          {
            echo "changelog<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          tag_name="v${{ steps.changelog.outputs.version }}"
          if git tag -l | grep -q "^${tag_name}$"; then
            echo "Tag $tag_name already exists — skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $tag_name does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update version badge in docs
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          version="${{ steps.changelog.outputs.version }}"
          sed -i "s|badge/version-[0-9]*\.[0-9]*\.[0-9]*-blue|badge/version-${version}-blue|g" README.md USER_GUIDE.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md USER_GUIDE.md
          git diff --cached --quiet || git commit -m "chore: bump version badge to ${version} [skip ci]"
          git push

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag_name }}
          name: "WDB ${{ steps.changelog.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip release creation
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "Release for ${{ steps.changelog.outputs.version }} already exists. Skipping."
